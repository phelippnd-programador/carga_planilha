name: Docker

on:
  pull_request:
    branches:
      - develop

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log into Docker Hub
        uses: docker/login-action@v2
        with:
          registry: docker.io
          username: phelippnd
          password: dckr_pat_597NwRNtBVldh4q8ZeNVnqj0mPg

      - name: Build and push Docker image
        uses: docker/build-push-action@v2
        with:
          context: .
          push: true
          tags: |
           phelippnd/carga_planilha:${{ github.head_ref }}-latest
           phelippnd/carga_planilha:${{ github.head_ref | format('yyyyMMddHHmmss') }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
